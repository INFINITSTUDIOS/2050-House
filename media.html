<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Library | Feedia &amp; 2050 House</title>
  <meta name="description" content="Videos, conversations, performances and highlights from Feedia and 2050 House.">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="media">
  <header id="site-header"></header>


  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Media Library</span>
        <h1>Watch <span class="grad-text">Feedia &amp; 2050 House</span></h1>
        <p>Conversations, forums, performances and festival highlights from our YouTube channel.</p>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px">
          <a class="btn btn-primary" href="https://www.youtube.com/@Feedia2050?sub_confirmation=1" target="_blank" rel="noopener">▶ Subscribe on YouTube</a>
        </div>
      </div>
    </section>

    <section class="section-sm">
      <div class="container">
        <div class="feature-video card" id="featured"></div>
      </div>
    </section>

    <section class="section-sm">
      <div class="container">
        <div class="toolbar">
          <div class="group" id="media-cats"></div>
          <div class="group">
            <label class="search"><span class="sr-only">Search videos</span><input class="input" id="media-search" type="search" placeholder="Search videos"></label>
            <select class="select" id="media-sort" aria-label="Sort" style="width:auto;border-radius:999px">
              <option value="new">Newest</option>
              <option value="old">Oldest</option>
              <option value="long">Longest</option>
              <option value="short">Shortest</option>
            </select>
          </div>
        </div>
        <p class="muted" id="media-count" aria-live="polite"></p>
        <div class="grid grid-3" id="media-grid"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/media.js"></script>
</body>
</html>
